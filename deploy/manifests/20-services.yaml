# Backing services and operator of the LLM autoscaler.
# One image (llm-autoscaler) with per-Deployment subcommands, plus the
# Python multi-agent reasoning service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-acquisition
  namespace: llm-autoscaler-system
  labels: &labels
    app.kubernetes.io/name: llm-autoscaler
    app.kubernetes.io/component: data-acquisition
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-autoscaler
      app.kubernetes.io/component: data-acquisition
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: llm-autoscaler
      containers:
        - name: service
          image: llm-autoscaler:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          command: ["/usr/local/bin/llm-autoscaler", "dataacquisition"]
          ports:
            - containerPort: 50051
              name: grpc
          readinessProbe:
            tcpSocket: { port: 50051 }
          livenessProbe:
            tcpSocket: { port: 50051 }
---
apiVersion: v1
kind: Service
metadata:
  name: data-acquisition
  namespace: llm-autoscaler-system
  labels:
    app.kubernetes.io/name: llm-autoscaler
    app.kubernetes.io/component: data-acquisition
spec:
  selector:
    app.kubernetes.io/name: llm-autoscaler
    app.kubernetes.io/component: data-acquisition
  ports:
    - port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-interface
  namespace: llm-autoscaler-system
  labels: &labels
    app.kubernetes.io/name: llm-autoscaler
    app.kubernetes.io/component: llm-interface
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-autoscaler
      app.kubernetes.io/component: llm-interface
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: llm-autoscaler
      containers:
        - name: service
          image: llm-autoscaler:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          # mock:// serves deterministic analyst decisions without an
          # external LLM; point --llm-provider-endpoint at any
          # OpenAI-compatible base URL for real models.
          command: ["/usr/local/bin/llm-autoscaler", "llminterface"]
          args:
            - --llm-provider-endpoint=mock://
            - --llm-provider-extra-json={"reasoning_effort":"low"}
          ports:
            - containerPort: 50052
              name: grpc
          readinessProbe:
            tcpSocket: { port: 50052 }
          livenessProbe:
            tcpSocket: { port: 50052 }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-interface
  namespace: llm-autoscaler-system
  labels:
    app.kubernetes.io/name: llm-autoscaler
    app.kubernetes.io/component: llm-interface
spec:
  selector:
    app.kubernetes.io/name: llm-autoscaler
    app.kubernetes.io/component: llm-interface
  ports:
    - port: 50052
      targetPort: 50052
---
