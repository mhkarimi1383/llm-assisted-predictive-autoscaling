# Prometheus configuration for LLM-Based Intelligent Autoscaling System
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "rules/*.yml"

scrape_configs:
  # Scrape the autoscaler itself
  - job_name: 'llm-autoscaler'
    static_configs:
      - targets: ['llm-autoscaler:9090']

  # Scrape Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Scrape workload predictor (example)
  - job_name: 'workload-predictor'
    static_configs:
      - targets: ['workload-predictor:8080']

  # Scrape Kubernetes (if available)
  # - job_name: 'kubernetes-pods'
  #   kubernetes_sd_configs:
